# Generated from Omarchy's everforest colors.
# This is a persistent profile: edit it if you want per-theme customizations.

[app]
overall = { bg = "#2d353b" }

[mgr]
cwd = { fg = "#83c092" }
find_keyword = { fg = "#dbbc7f", bold = true }
find_position = { fg = "#d699b6", italic = true }
marker_copied = { fg = "#a7c080", bg = "#a7c080" }
marker_cut = { fg = "#e67e80", bg = "#e67e80" }
marker_marked = { fg = "#83c092", bg = "#83c092" }
marker_selected = { fg = "#7fbbb3", bg = "#7fbbb3" }
count_copied = { fg = "#2d353b", bg = "#a7c080" }
count_cut = { fg = "#2d353b", bg = "#e67e80" }
count_selected = { fg = "#2d353b", bg = "#7fbbb3" }
border_symbol = "│"
border_style = { fg = "#475258" }

[tabs]
active = { fg = "#2d353b", bg = "#d3c6aa", bold = true }
inactive = { fg = "#d3c6aa", bg = "#475258" }

[mode]
normal_main = { fg = "#2d353b", bg = "#7fbbb3", bold = true }
normal_alt = { fg = "#7fbbb3", bg = "#475258" }
select_main = { fg = "#2d353b", bg = "#a7c080", bold = true }
select_alt = { fg = "#a7c080", bg = "#475258" }
unset_main = { fg = "#2d353b", bg = "#e67e80", bold = true }
unset_alt = { fg = "#e67e80", bg = "#475258" }

[indicator]
parent = { fg = "#2d353b", bg = "#d3c6aa" }
current = { fg = "#2d353b", bg = "#7fbbb3" }
preview = { fg = "#2d353b", bg = "#d3c6aa" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#d3c6aa", bold = true }
progress_normal = { fg = "#a7c080", bg = "#475258" }
progress_error = { fg = "#dbbc7f", bg = "#e67e80" }
perm_type = { fg = "#7fbbb3" }
perm_read = { fg = "#dbbc7f" }
perm_write = { fg = "#e67e80" }
perm_exec = { fg = "#a7c080" }
perm_sep = { fg = "#475258" }

[input]
border = { fg = "#7fbbb3" }
title = { fg = "#d3c6aa" }
value = { fg = "#d3c6aa" }
selected = { fg = "#2d353b", bg = "#d3c6aa" }

[pick]
border = { fg = "#7fbbb3" }
active = { fg = "#d699b6", bold = true }
inactive = { fg = "#d3c6aa" }

[confirm]
border = { fg = "#7fbbb3" }
title = { fg = "#7fbbb3" }
body = { fg = "#d3c6aa" }
btn_yes = { fg = "#2d353b", bg = "#a7c080" }
btn_no = { fg = "#2d353b", bg = "#e67e80" }

[cmp]
border = { fg = "#7fbbb3" }

[tasks]
border = { fg = "#7fbbb3" }
title = { fg = "#d3c6aa" }
hovered = { fg = "#d699b6", bold = true }

[which]
mask = { bg = "#475258" }
cand = { fg = "#83c092" }
rest = { fg = "#475258" }
desc = { fg = "#d699b6" }
separator = "    "
separator_style = { fg = "#475258" }

[help]
on = { fg = "#83c092" }
run = { fg = "#d699b6" }
desc = { fg = "#475258" }
hovered = { fg = "#d3c6aa", bg = "#475258", bold = true }
footer = { fg = "#d3c6aa", bg = "#475258" }

[notify]
title_info = { fg = "#83c092" }
title_warn = { fg = "#dbbc7f" }
title_error = { fg = "#e67e80" }

[spot]
border = { fg = "#7fbbb3" }
title = { fg = "#7fbbb3" }
tbl_cell = { fg = "#2d353b", bg = "#d3c6aa" }
tbl_col = { fg = "#d3c6aa", bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#dbbc7f" },
	{ mime = "{audio,video}/*", fg = "#d699b6" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "#e67e80" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#83c092" },
	{ url = "*", is = "orphan", fg = "#e67e80" },
	{ url = "*", is = "exec", fg = "#a7c080" },
	{ url = "*/", fg = "#7fbbb3" },
]
