# Generated from Omarchy's rose-pine colors.
# This is a persistent profile: edit it if you want per-theme customizations.

[app]
overall = { bg = "#faf4ed" }

[mgr]
cwd = { fg = "#d7827e" }
find_keyword = { fg = "#ea9d34", bold = true }
find_position = { fg = "#907aa9", italic = true }
marker_copied = { fg = "#286983", bg = "#286983" }
marker_cut = { fg = "#b4637a", bg = "#b4637a" }
marker_marked = { fg = "#d7827e", bg = "#d7827e" }
marker_selected = { fg = "#56949f", bg = "#56949f" }
count_copied = { fg = "#575279", bg = "#286983" }
count_cut = { fg = "#575279", bg = "#b4637a" }
count_selected = { fg = "#575279", bg = "#56949f" }
border_symbol = "│"
border_style = { fg = "#9893a5" }

[tabs]
active = { fg = "#575279", bg = "#dfdad9", bold = true }
inactive = { fg = "#575279", bg = "#f2e9e1" }

[mode]
normal_main = { fg = "#575279", bg = "#56949f", bold = true }
normal_alt = { fg = "#56949f", bg = "#f2e9e1" }
select_main = { fg = "#575279", bg = "#286983", bold = true }
select_alt = { fg = "#286983", bg = "#f2e9e1" }
unset_main = { fg = "#575279", bg = "#b4637a", bold = true }
unset_alt = { fg = "#b4637a", bg = "#f2e9e1" }

[indicator]
parent = { fg = "#575279", bg = "#575279" }
current = { fg = "#575279", bg = "#56949f" }
preview = { fg = "#575279", bg = "#575279" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#575279", bold = true }
progress_normal = { fg = "#286983", bg = "#f2e9e1" }
progress_error = { fg = "#ea9d34", bg = "#b4637a" }
perm_type = { fg = "#56949f" }
perm_read = { fg = "#ea9d34" }
perm_write = { fg = "#b4637a" }
perm_exec = { fg = "#286983" }
perm_sep = { fg = "#9893a5" }

[input]
border = { fg = "#56949f" }
title = { fg = "#575279" }
value = { fg = "#575279" }
selected = { fg = "#575279", bg = "#dfdad9" }

[pick]
border = { fg = "#56949f" }
active = { fg = "#907aa9", bold = true }
inactive = { fg = "#575279" }

[confirm]
border = { fg = "#56949f" }
title = { fg = "#56949f" }
body = { fg = "#575279" }
btn_yes = { fg = "#575279", bg = "#286983" }
btn_no = { fg = "#575279", bg = "#b4637a" }

[cmp]
border = { fg = "#56949f" }

[tasks]
border = { fg = "#56949f" }
title = { fg = "#575279" }
hovered = { fg = "#907aa9", bold = true }

[which]
mask = { bg = "#f2e9e1" }
cand = { fg = "#d7827e" }
rest = { fg = "#9893a5" }
desc = { fg = "#907aa9" }
separator = "    "
separator_style = { fg = "#9893a5" }

[help]
on = { fg = "#d7827e" }
run = { fg = "#907aa9" }
desc = { fg = "#9893a5" }
hovered = { fg = "#575279", bg = "#f2e9e1", bold = true }
footer = { fg = "#575279", bg = "#f2e9e1" }

[notify]
title_info = { fg = "#d7827e" }
title_warn = { fg = "#ea9d34" }
title_error = { fg = "#b4637a" }

[spot]
border = { fg = "#56949f" }
title = { fg = "#56949f" }
tbl_cell = { fg = "#575279", bg = "#dfdad9" }
tbl_col = { fg = "#575279", bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#ea9d34" },
	{ mime = "{audio,video}/*", fg = "#907aa9" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "#b4637a" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#d7827e" },
	{ url = "*", is = "orphan", fg = "#b4637a" },
	{ url = "*", is = "exec", fg = "#286983" },
	{ url = "*/", fg = "#56949f" },
]
