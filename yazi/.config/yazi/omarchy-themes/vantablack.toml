# Generated from Omarchy's vantablack colors.
# This is a persistent profile: edit it if you want per-theme customizations.

[app]
overall = { bg = "#000000" }

[mgr]
cwd = { fg = "#b0b0b0" }
find_keyword = { fg = "#cecece", bold = true }
find_position = { fg = "#9b9b9b", italic = true }
marker_copied = { fg = "#b6b6b6", bg = "#b6b6b6" }
marker_cut = { fg = "#a4a4a4", bg = "#a4a4a4" }
marker_marked = { fg = "#b0b0b0", bg = "#b0b0b0" }
marker_selected = { fg = "#8d8d8d", bg = "#8d8d8d" }
count_copied = { fg = "#000000", bg = "#b6b6b6" }
count_cut = { fg = "#000000", bg = "#a4a4a4" }
count_selected = { fg = "#000000", bg = "#8d8d8d" }
border_symbol = "│"
border_style = { fg = "#5c5c5c" }

[tabs]
active = { fg = "#000000", bg = "#ffffff", bold = true }
inactive = { fg = "#ffffff", bg = "#404040" }

[mode]
normal_main = { fg = "#000000", bg = "#8d8d8d", bold = true }
normal_alt = { fg = "#8d8d8d", bg = "#404040" }
select_main = { fg = "#000000", bg = "#b6b6b6", bold = true }
select_alt = { fg = "#b6b6b6", bg = "#404040" }
unset_main = { fg = "#000000", bg = "#a4a4a4", bold = true }
unset_alt = { fg = "#a4a4a4", bg = "#404040" }

[indicator]
parent = { fg = "#000000", bg = "#ffffff" }
current = { fg = "#000000", bg = "#8d8d8d" }
preview = { fg = "#000000", bg = "#ffffff" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#b6b6b6", bg = "#404040" }
progress_error = { fg = "#cecece", bg = "#a4a4a4" }
perm_type = { fg = "#8d8d8d" }
perm_read = { fg = "#cecece" }
perm_write = { fg = "#a4a4a4" }
perm_exec = { fg = "#b6b6b6" }
perm_sep = { fg = "#5c5c5c" }

[input]
border = { fg = "#8d8d8d" }
title = { fg = "#ffffff" }
value = { fg = "#ffffff" }
selected = { fg = "#000000", bg = "#ffffff" }

[pick]
border = { fg = "#8d8d8d" }
active = { fg = "#9b9b9b", bold = true }
inactive = { fg = "#ffffff" }

[confirm]
border = { fg = "#8d8d8d" }
title = { fg = "#8d8d8d" }
body = { fg = "#ffffff" }
btn_yes = { fg = "#000000", bg = "#b6b6b6" }
btn_no = { fg = "#000000", bg = "#a4a4a4" }

[cmp]
border = { fg = "#8d8d8d" }

[tasks]
border = { fg = "#8d8d8d" }
title = { fg = "#ffffff" }
hovered = { fg = "#9b9b9b", bold = true }

[which]
mask = { bg = "#404040" }
cand = { fg = "#b0b0b0" }
rest = { fg = "#5c5c5c" }
desc = { fg = "#9b9b9b" }
separator = "    "
separator_style = { fg = "#5c5c5c" }

[help]
on = { fg = "#b0b0b0" }
run = { fg = "#9b9b9b" }
desc = { fg = "#5c5c5c" }
hovered = { fg = "#ffffff", bg = "#404040", bold = true }
footer = { fg = "#ffffff", bg = "#404040" }

[notify]
title_info = { fg = "#b0b0b0" }
title_warn = { fg = "#cecece" }
title_error = { fg = "#a4a4a4" }

[spot]
border = { fg = "#8d8d8d" }
title = { fg = "#8d8d8d" }
tbl_cell = { fg = "#000000", bg = "#ffffff" }
tbl_col = { fg = "#ffffff", bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#cecece" },
	{ mime = "{audio,video}/*", fg = "#9b9b9b" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "#a4a4a4" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#b0b0b0" },
	{ url = "*", is = "orphan", fg = "#a4a4a4" },
	{ url = "*", is = "exec", fg = "#b6b6b6" },
	{ url = "*/", fg = "#8d8d8d" },
]
