# Generated from Omarchy's gruvbox colors.
# This is a persistent profile: edit it if you want per-theme customizations.

[app]
overall = { bg = "#282828" }

[mgr]
cwd = { fg = "#89b482" }
find_keyword = { fg = "#d8a657", bold = true }
find_position = { fg = "#d3869b", italic = true }
marker_copied = { fg = "#a9b665", bg = "#a9b665" }
marker_cut = { fg = "#ea6962", bg = "#ea6962" }
marker_marked = { fg = "#89b482", bg = "#89b482" }
marker_selected = { fg = "#7daea3", bg = "#7daea3" }
count_copied = { fg = "#ebdbb2", bg = "#a9b665" }
count_cut = { fg = "#ebdbb2", bg = "#ea6962" }
count_selected = { fg = "#ebdbb2", bg = "#7daea3" }
border_symbol = "│"
border_style = { fg = "#3c3836" }

[tabs]
active = { fg = "#ebdbb2", bg = "#d65d0e", bold = true }
inactive = { fg = "#d4be98", bg = "#3c3836" }

[mode]
normal_main = { fg = "#ebdbb2", bg = "#7daea3", bold = true }
normal_alt = { fg = "#7daea3", bg = "#3c3836" }
select_main = { fg = "#ebdbb2", bg = "#a9b665", bold = true }
select_alt = { fg = "#a9b665", bg = "#3c3836" }
unset_main = { fg = "#ebdbb2", bg = "#ea6962", bold = true }
unset_alt = { fg = "#ea6962", bg = "#3c3836" }

[indicator]
parent = { fg = "#ebdbb2", bg = "#d4be98" }
current = { fg = "#ebdbb2", bg = "#7daea3" }
preview = { fg = "#ebdbb2", bg = "#d4be98" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#d4be98", bold = true }
progress_normal = { fg = "#a9b665", bg = "#3c3836" }
progress_error = { fg = "#d8a657", bg = "#ea6962" }
perm_type = { fg = "#7daea3" }
perm_read = { fg = "#d8a657" }
perm_write = { fg = "#ea6962" }
perm_exec = { fg = "#a9b665" }
perm_sep = { fg = "#3c3836" }

[input]
border = { fg = "#7daea3" }
title = { fg = "#d4be98" }
value = { fg = "#d4be98" }
selected = { fg = "#ebdbb2", bg = "#d65d0e" }

[pick]
border = { fg = "#7daea3" }
active = { fg = "#d3869b", bold = true }
inactive = { fg = "#d4be98" }

[confirm]
border = { fg = "#7daea3" }
title = { fg = "#7daea3" }
body = { fg = "#d4be98" }
btn_yes = { fg = "#ebdbb2", bg = "#a9b665" }
btn_no = { fg = "#ebdbb2", bg = "#ea6962" }

[cmp]
border = { fg = "#7daea3" }

[tasks]
border = { fg = "#7daea3" }
title = { fg = "#d4be98" }
hovered = { fg = "#d3869b", bold = true }

[which]
mask = { bg = "#3c3836" }
cand = { fg = "#89b482" }
rest = { fg = "#3c3836" }
desc = { fg = "#d3869b" }
separator = "    "
separator_style = { fg = "#3c3836" }

[help]
on = { fg = "#89b482" }
run = { fg = "#d3869b" }
desc = { fg = "#3c3836" }
hovered = { fg = "#d4be98", bg = "#3c3836", bold = true }
footer = { fg = "#d4be98", bg = "#3c3836" }

[notify]
title_info = { fg = "#89b482" }
title_warn = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

[spot]
border = { fg = "#7daea3" }
title = { fg = "#7daea3" }
tbl_cell = { fg = "#ebdbb2", bg = "#d65d0e" }
tbl_col = { fg = "#d4be98", bold = true }

[filetype]
rules = [
	{ mime = "image/*", fg = "#d8a657" },
	{ mime = "{audio,video}/*", fg = "#d3869b" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio}", fg = "#ea6962" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#89b482" },
	{ url = "*", is = "orphan", fg = "#ea6962" },
	{ url = "*", is = "exec", fg = "#a9b665" },
	{ url = "*/", fg = "#7daea3" },
]
